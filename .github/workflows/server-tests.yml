name: S Device Server Tests
on:
  push:
    paths:
      - 'server/**'
      - 'dashboard/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'dashboard/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run local API tests
        run: python -m unittest discover -s server -p 'test_*.py' -v
